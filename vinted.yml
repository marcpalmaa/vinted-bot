name: vinted-bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: vinted-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements-actions.txt

      # Recupera el estado (filtros y artículos ya vistos) de la ejecución anterior
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-never-matches-exactly
          restore-keys: state-

      - run: python vinted_once.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

      # Guarda el estado para la siguiente ejecución
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: state-${{ github.run_id }}
